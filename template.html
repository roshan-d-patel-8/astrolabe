<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Astrolabe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#f4f5f1;--ink:#182c32;--muted:#53676b;--line:#ccd5d1;--panel:#fff;--brass:#826222;--brass-soft:#e9ece7;--crit:#b0413a}
@media (prefers-color-scheme:dark){:root{--bg:#102329;--ink:#e3ede7;--muted:#a5b9bb;--line:#365057;--panel:#162d34;--brass:#ddbd78;--brass-soft:#203a41;--crit:#f49a8e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,'Avenir Next',sans-serif;-webkit-font-smoothing:antialiased}
.card{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px}
.eyebrow{font-family:"IBM Plex Mono",Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:inherit;font-weight:500;font-size:32px;letter-spacing:-.035em;line-height:1.2;margin:0 0 16px}
h1 em{font-style:normal}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass)}
button{margin-top:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:5px;background:var(--brass-soft);color:var(--ink);font:600 14px Manrope,sans-serif;cursor:pointer}button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:13px;min-height:18px;margin-top:10px}
.foot{margin-top:14px;font-size:12px;color:var(--muted)}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
:root{--bg:#0c111c;--ink:#f0e3c5;--muted:#c0b194;--line:#716044;--panel:#151d2a;--brass:#d4b16a;--brass-soft:#272b32;--crit:#eeaa91}
body{font-family:'Avenir Next',sans-serif;background:radial-gradient(ellipse at 50% 35%,#293245 0%,#101725 48%,#080c13 100%);padding:30px 0}
.card{position:relative;width:min(460px,90vw);padding:38px;border:1px solid var(--brass);outline:1px solid #716044;outline-offset:7px;border-radius:190px 190px 2px 2px;box-shadow:0 24px 80px #0009,inset 0 0 0 6px #1d2634;text-align:center;background:linear-gradient(155deg,#222d3d,#101721 65%)}
.gate-seal{display:block;width:108px;height:108px;margin:6px auto 24px;color:var(--brass)}
.eyebrow{font:10px Cinzel,Georgia,serif;letter-spacing:.19em;margin-bottom:12px;color:var(--brass)}
h1{font:500 32px/1.2 Cinzel,Georgia,serif;letter-spacing:0;margin-bottom:20px}
.sub{font:500 20px/1.35 'Cormorant Garamond',Georgia,serif;margin-bottom:25px}
input{text-align:center;border-radius:0;background:#0c111c;padding:13px}
button{font:600 13px Cinzel,Georgia,serif;border:1px solid var(--brass);border-radius:0;letter-spacing:.05em;padding:15px}
button:hover{background:#3b3c36}.foot{font-size:10px;line-height:1.6;border-top:1px solid var(--line);padding-top:18px}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
@media(max-width:380px){.card{padding:28px 24px}h1{font-size:27px}}
</style>
</head>
<body>
<form class="card" id="gate" autocomplete="off">
  <svg class="gate-seal" viewBox="0 0 120 120" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="60" cy="60" r="58" stroke-width=".5"/><circle cx="60" cy="60" r="50"/><circle cx="60" cy="60" r="34"/><ellipse cx="60" cy="60" rx="17" ry="34"/><path d="M26 60h68M60 10v16m0 68v16M10 60h16m68 0h16M60 28l8 24 24 8-24 8-8 24-8-24-24-8 24-8z"/></svg>
  <div class="eyebrow">A personal observatory</div>
  <h1>The <em>Astrolabe</em></h1>
  <p class="sub">Your private working atlas. Enter your passphrase or use your access link. This browser will remember your access.</p>
  <input type="password" id="pass" placeholder="passphrase" aria-label="passphrase" autofocus>
  <button type="submit" id="unlock">Unlock</button>
  <div class="err" id="err" role="status" aria-live="polite"></div>
  <div class="foot">AES-256-GCM · content decrypted in your browser</div>
</form>
<script>
"use strict";
const BLOB = "__PAYLOAD__";
const PBKDF2_ITERS = 310000;
const KEY = "ast-pass";
function b64ToBytes(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function fragmentPass(){
  const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+={0,2})/);
  if(!m) return null;
  try{ return new TextDecoder().decode(b64ToBytes(m[1].replace(/-/g,"+").replace(/_/g,"/"))); }catch(_){ return null }
}
async function decrypt(pass){
  const raw = b64ToBytes(BLOB);
  const salt = raw.slice(0,16), nonce = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:PBKDF2_ITERS, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:nonce}, key, ct);
  return new TextDecoder().decode(pt);
}
function boot(html){
  // Replace this shell with the decrypted page; inline scripts execute on write.
  document.open(); document.write(html); document.close();
}
document.getElementById("gate").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("unlock"), err = document.getElementById("err");
  const pass = document.getElementById("pass").value;
  btn.disabled = true; err.textContent = "";
  try{
    const html = await decrypt(pass);
    try{ localStorage.setItem(KEY, pass); }catch(_){}
    boot(html);
  }catch(_){
    err.textContent = "That passphrase does not open this plate.";
    const c = document.getElementById("gate"); c.classList.add("shake"); setTimeout(()=>c.classList.remove("shake"), 400);
    btn.disabled = false;
  }
});
async function tryLink(){
  const fromLink = fragmentPass();
  if(!fromLink) return false;
  try{ const html = await decrypt(fromLink); try{ localStorage.setItem(KEY, fromLink); }catch(_){} boot(html); return true; }catch(_){ return false; }
}
window.addEventListener("hashchange", tryLink); // magic link pasted into an already-open gate tab
(async ()=>{
  if(await tryLink()) return;
  let saved = null; try{ saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); }catch(_){}
  if(saved){
    try{ boot(await decrypt(saved)); return; }
    catch(_){ try{ localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); }catch(_){} }
  }
})();
</script>
</body>
</html>
